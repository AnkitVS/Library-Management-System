spring.application.name=LibraryManagementSystem

# DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/librarymgmtsys
spring.datasource.username=use_yourmysql_username
spring.datasource.password=use_yourmysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.view.prefix=/Views/
spring.mvc.view.suffix=.jsp